[tool.poetry]
name = "llm-antigravity-orchestrator"
version = "1.0.0"
description = "Um orquestrador inteligente multi-agente e auto-gerenciado construído sobre o Google Antigravity (AGY) SDK, integrando controle de custos, hooks e tracing."
authors = ["Cayo Eduardo <cayoesn@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
pydantic = "^2.7.4"
google-antigravity = "*"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=app --cov-report=term-missing"
asyncio_mode = "auto"
